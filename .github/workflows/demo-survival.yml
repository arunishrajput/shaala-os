name: Demo survival

# PROMPT.md §11: free-tier backends sleep, and judges mutate shared demo data
# at odd hours. Two scheduled jobs, distinguished by which cron fired
# (github.event.schedule), running in the same workflow so there's one place
# to look for both:
#   - every 10 minutes: hit /health to keep the Render instance warm (it
#     sleeps after ~15 minutes idle; 10 minutes keeps a margin)
#   - top of every hour: POST /demo/reset to restore the fixed seed dataset
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  keep-warm:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -sf -o /dev/null -w "health: %{http_code} in %{time_total}s\n" \
            https://shaala-os-api.onrender.com/health

  hourly-reset:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: POST /demo/reset
        run: |
          curl -sf -o /dev/null -w "reset: %{http_code} in %{time_total}s\n" \
            -X POST https://shaala-os-api.onrender.com/demo/reset
